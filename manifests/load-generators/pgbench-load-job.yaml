apiVersion: batch/v1
kind: Job
metadata:
  name: pgbench-load-generator
  namespace: lab-workloads
  labels:
    app.kubernetes.io/name: pgbench-load
    app.kubernetes.io/part-of: kafka-edb-lab
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbench-load
    spec:
      restartPolicy: Never
      containers:
        - name: pgbench
          image: ghcr.io/cloudnative-pg/postgresql:16.2
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo ">>> Waiting for EDB Postgres to be reachable..."
              until pg_isready -h edb-postgres-rw -p 5432 -U app; do
                echo "Waiting for postgres..."
                sleep 2
              done

              echo ">>> Initializing pgbench schema (Scale factor: 25)..."
              PGPASSWORD="$PGPASSWORD" pgbench -i -s 25 -h edb-postgres-rw -p 5432 -U app app || true

              echo ">>> Starting aggressive pgbench load (Clients: 16, Threads: 4, Duration: 60s)..."
              START_TIME=$(date +%s)
              PGPASSWORD="$PGPASSWORD" pgbench -c 16 -j 4 -T 60 -P 5 -h edb-postgres-rw -p 5432 -U app app | tee /tmp/pgbench-results.txt
              END_TIME=$(date +%s)
              echo ">>> pgbench test completed in $((END_TIME - START_TIME)) seconds."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: edb-postgres-app
                  key: password
          resources:
            requests:
              cpu: "300m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
